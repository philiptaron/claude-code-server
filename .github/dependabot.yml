version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # flake.lock's nixpkgs input
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
