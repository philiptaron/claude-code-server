version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Let a release sit for a week first, in case it is pulled.
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let a release sit for a week first, in case it is pulled.
    cooldown:
      default-days: 7

  # flake.lock's nixpkgs input
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    # Let a release sit for a week first, in case it is pulled.
    cooldown:
      default-days: 7
