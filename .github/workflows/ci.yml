name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The module's test is a NixOS VM, which wants KVM.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      # Builds ccd-cli-fs (running its tests) and its builder, runs the VM test, and
      # evaluates every package
      - name: Flake check
        run: nix flake check --print-build-logs
      # Downloads the binary, checks its hash, and runs its --version
      - name: Build the newest Claude Code
        run: nix build .#claude-code --print-build-logs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: rustfmt
        run: nix develop --command cargo fmt --check
      - name: clippy
        run: nix develop --command cargo clippy --all-targets --locked -- -D warnings
      - name: nixfmt
        run: git ls-files -z '*.nix' | xargs -0 nix develop --command nixfmt --check
